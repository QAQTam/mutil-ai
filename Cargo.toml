[package]
name = "mutil-ai"
version = "0.1.0"
edition = "2024"
description = "A beginner-friendly, provider-neutral Rust AI SDK with a strict normalization layer."
license = "MIT OR Apache-2.0"
readme = "README.md"

[lib]
name = "mutil_ai"

[dependencies]
async-trait = "0.1"
bytes = "1"
futures-core = "0.3"
httpdate = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "gzip", "query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
futures-executor = "0.3"
futures-util = "0.3"
libc = "0.2"
sse-stream = { version = "0.3", default-features = false, features = ["memchr"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[[example]]
name = "hello"
path = "examples/hello.rs"

[[example]]
name = "tool_agent"
path = "examples/tool_agent.rs"

[[example]]
name = "normalize"
path = "examples/normalize.rs"

[[example]]
name = "reasoning"
path = "examples/reasoning.rs"

[[example]]
name = "streaming"
path = "examples/streaming.rs"
